name: Run Website

on:
  push:
    branches:
      - main

jobs:
  run-website:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Start Flask website
        run: |
          python app.py &
          sleep 5
          curl http://127.0.0.1:5000
